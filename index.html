<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Event Registration</title>
<style>
  :root{
    --ink:#14213d;
    --muted:#52607a;
    --bg:#eef3fa;
    --accent:#1a4f8b;
    --accent-dark:#123864;
    --line:#cfd8e6;
    --ok:#1b7f4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    padding:32px 16px;
  }
  .card{
    max-width:560px;
    margin:0 auto;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 24px rgba(20,33,61,.12);
  }
  .banner{background:var(--accent);color:#fff;padding:28px 32px;}
  .banner h1{font-size:1.6rem;line-height:1.25;}
  .banner p{margin-top:8px;opacity:.92;}
  .meta{margin-top:12px;font-size:.9rem;opacity:.9;}
  .badge{
    display:inline-block;margin-top:14px;
    background:#fff;color:var(--accent);
    font-size:.8rem;font-weight:700;
    padding:3px 12px;border-radius:999px;
  }
  form{padding:28px 32px 20px;}
  .field{margin-bottom:16px;}
  label{display:block;margin-bottom:6px;font-weight:600;font-size:.95rem;}
  input{
    width:100%;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;
    font:inherit;color:var(--ink);background:#fff;
  }
  input:focus{outline:3px solid #b9d3f2;border-color:var(--accent);}
  input[readonly]{background:#f4f7fb;color:var(--muted);}
  button{
    width:100%;padding:12px;margin-top:6px;
    background:var(--accent);color:#fff;
    border:none;border-radius:8px;
    font:inherit;font-weight:700;cursor:pointer;
  }
  button:hover{background:var(--accent-dark);}
  button:focus-visible{outline:3px solid #b9d3f2;outline-offset:2px;}
  #msg{
    display:none;margin:0 32px 20px;padding:12px 14px;
    background:#e6f5ec;color:var(--ok);
    border-radius:8px;font-weight:600;
  }
  footer{
    background:var(--bg);text-align:center;
    font-size:.82rem;color:var(--muted);padding:14px;
  }
  @media (max-width:520px){
    .banner,form{padding-left:20px;padding-right:20px;}
    #msg{margin-left:20px;margin-right:20px;}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="banner">
      <h1>National Tech Hackathon 2026</h1>
      <p>A 24-hour innovation and coding challenge where student teams build working solutions to real problems.</p>
      <p class="meta">Event date: 15 October 2026</p>
      <span class="badge">Version 1</span>
    </div>

    <form id="regForm">
      <div class="field">
        <label for="name">Student name</label>
        <input id="name" type="text" value="Akshaya P" required>
      </div>
      <div class="field">
        <label for="reg">Register number</label>
        <input id="reg" type="text" value="24MIS0112" required>
      </div>
      <div class="field">
        <label for="dept">Department</label>
        <input id="dept" type="text" value="Software Engineering" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="date">Event date</label>
        <input id="date" type="date" value="2026-10-15" required>
      </div>
      <button type="submit">Register for this event</button>
    </form>

    <div id="msg" role="status"></div>

    <footer>Served from a Docker container on Kubernetes (3 replicas)</footer>
  </main>

<script>
  document.getElementById('regForm').addEventListener('submit', function(e){
    e.preventDefault();
    var n = document.getElementById('name').value;
    var m = document.getElementById('msg');
    m.textContent = 'Thanks ' + n + ', you are registered for National Tech Hackathon 2026.';
    m.style.display = 'block';
  });
</script>
</body>
</html>
